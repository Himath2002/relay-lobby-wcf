    <text x="595" y="311" fill="#148C78" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">NET.TCP · SECURITYMODE.NONE</text>
    <text x="595" y="335" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="14">localhost:8100 · buffered · bounded</text>

    <rect x="573" y="379" width="296" height="74" rx="10" fill="#F7FAFC" stroke="#D8E3EA"/>
    <text x="595" y="408" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">ILobbyService</text>
    <text x="595" y="433" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="14">commands + query operations</text>

    <rect x="573" y="469" width="296" height="74" rx="10" fill="#F7FAFC" stroke="#D8E3EA"/>
    <text x="595" y="498" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">ILobbyDuplexService</text>
    <text x="595" y="523" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="14">base operations + callback contract</text>

    <rect x="573" y="559" width="296" height="103" rx="10" fill="#F7FAFC" stroke="#D8E3EA"/>
    <text x="595" y="588" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">TransportConfiguration</text>
    <text x="595" y="613" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="14">500-character messages</text>
    <text x="595" y="637" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="14">10 MB files · 12 MB transport ceiling</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="982" y="198" width="386" height="490" rx="16" fill="#153247" stroke="#153247"/>
    <text x="1010" y="242" fill="#7DE0CA" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">RELAYLOBBY.SERVER</text>
    <text x="1010" y="283" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700">LobbyService</text>
    <text x="1010" y="313" fill="#B9CAD6" font-family="Inter, Segoe UI, sans-serif" font-size="15">singleton state coordinator</text>

    <rect x="1010" y="344" width="330" height="78" rx="10" fill="#1D4055"/>
    <text x="1032" y="375" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">Synchronized state</text>
    <text x="1032" y="400" fill="#BCD0DB" font-family="Inter, Segoe UI, sans-serif" font-size="14">players · rooms · messages · files</text>

    <rect x="1010" y="438" width="330" height="78" rx="10" fill="#1D4055"/>
    <text x="1032" y="469" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">Callback registry</text>
    <text x="1032" y="494" fill="#BCD0DB" font-family="Inter, Segoe UI, sans-serif" font-size="14">case-insensitive · fault-aware cleanup</text>

    <rect x="1010" y="532" width="330" height="128" rx="10" fill="#1D4055"/>
    <text x="1032" y="563" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700">Server-enforced rules</text>
    <text x="1032" y="590" fill="#BCD0DB" font-family="Inter, Segoe UI, sans-serif" font-size="14">unique usernames + room names</text>
    <text x="1032" y="614" fill="#BCD0DB" font-family="Inter, Segoe UI, sans-serif" font-size="14">same-room private communication</text>
    <text x="1032" y="638" fill="#BCD0DB" font-family="Inter, Segoe UI, sans-serif" font-size="14">recipient-filtered private callbacks</text>
  </g>

  <path d="M460 313H525" stroke="#3B82B7" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#blueArrow)"/>
  <path d="M525 374H460" stroke="#3B82B7" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#blueArrow)"/>
  <path d="M460 555H525" stroke="#148C78" stroke-width="2.5" marker-end="url(#tealArrow)"/>
  <path d="M525 615H460" stroke="#3B82B7" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M895 372H960" stroke="#148C78" stroke-width="2.5" marker-end="url(#tealArrow)"/>
  <path d="M960 502H895" stroke="#3B82B7" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <rect x="72" y="744" width="1296" height="80" rx="14" fill="#FFFFFF" stroke="#C9D8E3"/>
  <text x="100" y="776" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">DATA BOUNDARY</text>
  <text x="100" y="803" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="15">RelayLobby.Domain carries DataContract models; room listings expose summaries only, while private payloads are filtered to sender and recipient.</text>
  <rect x="1115" y="764" width="225" height="40" rx="20" fill="#E5F6F1"/>
  <text x="1227.5" y="790" text-anchor="middle" fill="#148C78" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">IN-MEMORY · LOCAL DEMO</text>
