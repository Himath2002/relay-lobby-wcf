      <path d="M1 1L11 6L1 11V1Z" fill="#3B82B7"/>
    </marker>
  </defs>

  <rect width="1440" height="880" rx="28" fill="url(#bg)"/>
  <text x="72" y="78" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700">Architecture with explicit communication boundaries</text>
  <text x="72" y="112" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="18">Two WPF interaction models share one contract surface and one synchronized in-memory state.</text>

  <text x="72" y="172" fill="#3B82B7" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">WINDOWS CLIENTS</text>
  <text x="547" y="172" fill="#148C78" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">TRANSPORT + CONTRACTS</text>
  <text x="1006" y="172" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">SERVICE HOST</text>

  <g filter="url(#cardShadow)">
    <rect x="72" y="198" width="388" height="230" rx="16" fill="#FFFFFF" stroke="#C9D8E3"/>
    <rect x="94" y="220" width="105" height="28" rx="14" fill="#E8F3FA"/>
    <text x="146.5" y="240" text-anchor="middle" fill="#3B82B7" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">POLLING</text>
    <text x="94" y="287" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="700">RelayLobby.Client.Polling</text>
    <text x="94" y="321" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="16">DispatcherTimer-driven refresh</text>
    <rect x="94" y="348" width="344" height="54" rx="9" fill="#F4F8FB" stroke="#D8E3EA"/>
    <text x="112" y="371" fill="#3E5566" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Lobby</text>
    <text x="173" y="371" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="14">1 s</text>
    <text x="233" y="371" fill="#3E5566" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Room</text>
    <text x="289" y="371" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="14">3 s</text>
    <text x="340" y="371" fill="#3E5566" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Private</text>
    <text x="400" y="371" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="14">1 s</text>
    <text x="112" y="392" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="12">Explicit request → response updates</text>
  </g>

  <g filter="url(#cardShadow)">
