    <text x="146.5" y="500" text-anchor="middle" fill="#148C78" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">DUPLEX</text>
    <text x="94" y="547" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="700">RelayLobby.Client.Duplex</text>
    <text x="94" y="581" fill="#5A6E7D" font-family="Inter, Segoe UI, sans-serif" font-size="16">ILobbyCallback-driven room state</text>
    <rect x="94" y="608" width="344" height="54" rx="9" fill="#F4F8FB" stroke="#D8E3EA"/>
    <text x="112" y="631" fill="#3E5566" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Push</text>
    <text x="151" y="631" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="14">messages · files · roster</text>
    <text x="112" y="652" fill="#728492" font-family="Inter, Segoe UI, sans-serif" font-size="12">5 s lobby-directory sync only</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="547" y="198" width="348" height="490" rx="16" fill="#FFFFFF" stroke="#BDD9D3"/>
    <circle cx="589" cy="240" r="18" fill="#E5F6F1"/>
    <path d="M580 240H598M589 231V249" stroke="#148C78" stroke-width="2.5" stroke-linecap="round"/>
    <text x="619" y="247" fill="#153247" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Shared boundary</text>

