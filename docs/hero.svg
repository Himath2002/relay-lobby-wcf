      <stop stop-color="#0B1220"/>
      <stop offset="0.56" stop-color="#10283A"/>
      <stop offset="1" stop-color="#132136"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="290" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67A9E4"/>
      <stop offset="0.5" stop-color="#26C6A5"/>
      <stop offset="1" stop-color="#67A9E4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050A12" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11V1Z" fill="#26C6A5"/>
