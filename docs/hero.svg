    <text x="172" y="341" text-anchor="middle" fill="#67A9E4" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">POLLING</text>
    <text x="116" y="391" fill="#F4F7FB" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="650">Interval client</text>
    <text x="116" y="422" fill="#9FB0C8" font-family="Inter, Segoe UI, sans-serif" font-size="16">Requests fresh room state on a</text>
    <text x="116" y="447" fill="#9FB0C8" font-family="Inter, Segoe UI, sans-serif" font-size="16">predictable cadence.</text>
    <circle cx="124" cy="489" r="5" fill="#67A9E4"/>
    <circle cx="149" cy="489" r="5" fill="#67A9E4" fill-opacity="0.72"/>
    <circle cx="174" cy="489" r="5" fill="#67A9E4" fill-opacity="0.44"/>
    <path d="M205 489H392" stroke="#67A9E4" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="545" y="276" width="350" height="284" rx="18" fill="#132539" stroke="#2E6158" stroke-width="1.5"/>
    <circle cx="720" cy="331" r="30" fill="#173B36" stroke="#26C6A5"/>
    <path d="M706 331H734M720 317V345" stroke="#26C6A5" stroke-width="3" stroke-linecap="round"/>
