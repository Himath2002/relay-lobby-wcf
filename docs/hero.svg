    <text x="720" y="426" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Segoe UI, sans-serif" font-size="16">Thread-safe, in-memory coordination</text>
    <rect x="584" y="464" width="272" height="58" rx="10" fill="#0F1C2C" stroke="#2A3A54"/>
    <text x="720" y="488" text-anchor="middle" fill="#26C6A5" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">LOCAL NET.TCP · PORT 8100</text>
    <text x="720" y="510" text-anchor="middle" fill="#A9B8CC" font-family="Inter, Segoe UI, sans-serif" font-size="13">bounded messages · isolated private payloads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="998" y="296" width="350" height="244" rx="18" fill="#111C2E" stroke="#2A3A54"/>
    <rect x="1022" y="320" width="112" height="30" rx="15" fill="#173B36"/>
    <text x="1078" y="341" text-anchor="middle" fill="#26C6A5" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">DUPLEX</text>
    <text x="1022" y="391" fill="#F4F7FB" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="650">Callback client</text>
    <text x="1022" y="422" fill="#9FB0C8" font-family="Inter, Segoe UI, sans-serif" font-size="16">Receives server-initiated room</text>
    <text x="1022" y="447" fill="#9FB0C8" font-family="Inter, Segoe UI, sans-serif" font-size="16">updates as state changes.</text>
    <path d="M1038 489H1224" stroke="#26C6A5" stroke-width="2" marker-end="url(#arrowTeal)"/>
    <path d="M1316 512H1130" stroke="#67A9E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <path d="M442 405H523" stroke="#67A9E4" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
  <path d="M895 405H976" stroke="#26C6A5" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M976 453H895" stroke="#67A9E4" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

