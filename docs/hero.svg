  <rect width="1440" height="720" rx="28" fill="url(#background)"/>
  <rect width="1440" height="720" rx="28" fill="url(#grid)"/>

  <text x="92" y="92" fill="#26C6A5" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">DISTRIBUTED DESKTOP SYSTEM</text>
  <text x="92" y="158" fill="#F4F7FB" font-family="Inter, Segoe UI, sans-serif" font-size="58" font-weight="700">RelayLobby</text>
  <text x="92" y="199" fill="#A9B8CC" font-family="Inter, Segoe UI, sans-serif" font-size="23">One WCF service. Two synchronization models. A shared conversation state.</text>

  <rect x="1034" y="84" width="314" height="48" rx="24" fill="#17243A" stroke="#2A3A54"/>
  <circle cx="1064" cy="108" r="6" fill="#26C6A5"/>
  <text x="1082" y="115" fill="#DCE5F2" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600">WPF · WCF · .NET Framework 4.8</text>

  <line x1="92" y1="236" x2="1348" y2="236" stroke="url(#accentLine)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="92" y="296" width="350" height="244" rx="18" fill="#111C2E" stroke="#2A3A54"/>
