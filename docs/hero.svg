      <path d="M1 1L11 6L1 11V1Z" fill="#67A9E4"/>
    </marker>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#E7EEF8" stroke-opacity="0.035"/>
