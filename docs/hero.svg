    <circle cx="754" cy="637" r="8" fill="#F4B860"/>
    <text x="776" y="643" fill="#DCE5F2" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600">10 MB file relay</text>

    <rect x="1015" y="610" width="333" height="54" rx="11" fill="#101C2D" stroke="#263953"/>
    <circle cx="1045" cy="637" r="8" fill="#A788E8"/>
    <text x="1067" y="643" fill="#DCE5F2" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600">Case-insensitive identity rules</text>
